# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: mtell

before:
  hooks:
    - go mod download

builds:
  - main: main.go
    hooks:
      post:
        - codesign --remove-signature "{{ .Path }}"
    ldflags: >
      -X github.com/cirruslabs/mtell/internal/version.Version={{.Version}}
      -X github.com/cirruslabs/mtell/internal/version.Commit={{.ShortCommit}}
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: binary
    format: binary
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
  - id: regular
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

release:
  prerelease: auto

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"

brews:
  - name: mtell
    ids:
      - regular
    repository:
      owner: cirruslabs
      name: homebrew-cli
    install: |
      bin.install "mtell"
      generate_completions_from_executable(bin/"mtell", "completion")
    caveats: See the Github repository for more information
    homepage: https://github.com/cirruslabs/mtell
    description: CLI to tell a machine to do something over VNC
    skip_upload: auto
